<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body class="finder-body finder-home-page{% if page.permalink == '/pixelart/' %} finder-page-pixel-art{% endif %}" data-disable-theme-sync="true">
    {% if page.url == '/' %}
    <main class="finder-home-shell" id="finder-main">
      {{ content }}
    </main>
    {% else %}
    <main class="finder-home-shell" id="finder-main">
      <header class="home-name-banner" aria-label="Site title">
        <a class="home-topbar-name" href="{{ site.baseurl }}/" aria-label="Jaden Andrea">
          <span class="home-topbar-name-default">Jaden Andrea</span>
          <span class="home-topbar-name-hover">Gadget</span>
        </a>
        <button
          class="home-nav-toggle"
          type="button"
          data-home-nav-toggle
          aria-expanded="false"
          aria-controls="home-nav-panel"
          aria-label="Open navigation drawer"
        >
          menu
        </button>
        <a class="home-resume-button" href="{{ site.baseurl }}/resume/" aria-label="Open resume">[Resume]</a>
      </header>

      <section class="home-explorer" data-home-explorer>
        {% include home-tree-nav.html %}
        <section class="home-preview home-preview-document" aria-live="polite">
          {{ content }}
        </section>
      </section>
      <button
        class="home-nav-overlay"
        type="button"
        data-home-nav-close
        aria-label="Close navigation drawer"
      ></button>
    </main>
    {% endif %}

    <section class="finder-gallery-window-shell" data-gallery-window hidden aria-hidden="true">
      <button class="finder-gallery-window-backdrop" type="button" data-gallery-dismiss aria-label="Close image preview"></button>
      <article class="finder-gallery-window" role="dialog" aria-modal="true" aria-label="Image preview">
        <header class="finder-gallery-window-toolbar">
          <div class="finder-gallery-window-controls" aria-hidden="true">
            <button class="finder-gallery-window-control finder-gallery-window-control-close" type="button" data-gallery-dismiss tabindex="-1"></button>
            <button class="finder-gallery-window-control finder-gallery-window-control-minimize" type="button" data-gallery-dismiss tabindex="-1"></button>
            <span class="finder-gallery-window-control finder-gallery-window-control-zoom"></span>
          </div>
          <p class="finder-gallery-window-title" data-gallery-title>Artwork Preview</p>
          <button class="finder-theme-button" type="button" data-gallery-dismiss>Close</button>
        </header>
        <div class="finder-gallery-window-body">
          <button class="finder-gallery-nav finder-gallery-nav-prev" type="button" data-gallery-prev aria-label="Previous image">‹</button>
          <img data-gallery-image src="" alt="">
          <button class="finder-gallery-nav finder-gallery-nav-next" type="button" data-gallery-next aria-label="Next image">›</button>
        </div>
      </article>
    </section>

    <script src="{{ site.baseurl }}/public/js/finder.js" defer></script>
    <script src="{{ site.baseurl }}/public/js/home-explorer.js?v=20260904-folders1" defer></script>
  </body>
</html>
